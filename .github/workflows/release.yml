name: Build and publish

# Creating a release here (marked pre-release) builds DHbox from the private
# source repo at the same tag, signs the archive for the in-app updater,
# also makes a DMG (drag to Applications) for first-time installs, attaches
# the files and then promotes the release to "latest".
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)build, for example v1.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "Tag $TAG is not like v1.2.3"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode/ {split($2, v, "."); print v[1]}')
          [ "$major" -ge 27 ] || { echo "Xcode 27 or newer is required"; exit 1; }

      - name: Check out the source
        uses: actions/checkout@v4
        with:
          repository: minhvuogdzz/DHbox
          ref: ${{ env.TAG }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: source

      - name: Check out the build helpers
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Install tools
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Check the version in the source matches the tag
        working-directory: source
        run: |
          found=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\} *$/\1/p' project.yml | head -1)
          echo "project.yml version: $found, tag version: $VERSION"
          [ "$found" = "$VERSION" ] || { echo "Version mismatch"; exit 1; }

      - name: Test the core
        working-directory: source/Packages/DHboxKit
        # RedactorTests draw images on the GPU, which GitHub's virtual Macs lack; they run on developer machines.
        run: swift test --skip RedactorTests

      - name: Install the signing certificate
        id: cert
        env:
          SIGNING_P12: ${{ secrets.DHBOX_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.DHBOX_SIGNING_PASSWORD }}
        run: |
          # Releases are signed with Devhouse Software's own certificate (no
          # Apple account): macOS then sees every version as the same app, so
          # privacy permissions survive updates. Without the secrets the build
          # is signed ad-hoc as before.
          if [ -z "$SIGNING_P12" ]; then
            echo "No signing certificate in the secrets: ad-hoc signature"
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/dhbox-signing.keychain-db"
          pass=$(uuidgen)
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/dhbox-signing.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/dhbox-signing.p12" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/dhbox-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -p codesigning "$keychain" | grep -E '[0-9A-F]{40}' | head -1 | awk '{print $2}')
          [ -n "$identity" ] || { echo "The certificate has no signing identity"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "Signing with identity $identity"

      - name: Build Release
        working-directory: source
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          mkdir -p build
          make release SELF_SIGN="$IDENTITY"

      - name: Check who signed it
        if: steps.cert.outputs.identity != ''
        working-directory: source
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          # The requirement macOS stores with each permission: the same text in
          # every release is what keeps the permissions.
          app="build/DerivedData/Build/Products/Release/DHbox.app"
          want=$(echo "$IDENTITY" | tr 'A-F' 'a-f')
          for part in "$app" "$app/Contents/MacOS/DHboxAgent" "$app"/Contents/PlugIns/*.appex; do
            req=$(codesign -dr - "$part" 2>&1 | sed -n 's/^designated => //p')
            echo "$(basename "$part"): $req"
            echo "$req" | grep -q "certificate root = H\"$want\"" || { echo "Not signed by the DHbox certificate"; exit 1; }
          done

      - name: Package and sign
        working-directory: source
        env:
          DHBOX_UPDATE_SIGNING_KEY: ${{ secrets.DHBOX_UPDATE_SIGNING_KEY }}
        run: |
          app="build/DerivedData/Build/Products/Release/DHbox.app"
          built=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
          [ "$built" = "$VERSION" ] || { echo "Built $built, expected $VERSION"; exit 1; }
          codesign --verify --deep --strict "$app"
          mkdir -p "$GITHUB_WORKSPACE/out"
          ditto -c -k --keepParent "$app" "$GITHUB_WORKSPACE/out/DHbox-$VERSION.zip"
          swift scripts/release/sign_update.swift "$GITHUB_WORKSPACE/out/DHbox-$VERSION.zip" > "$GITHUB_WORKSPACE/out/DHbox-$VERSION.zip.sig"
          test -s "$GITHUB_WORKSPACE/out/DHbox-$VERSION.zip.sig"
          (cd "$GITHUB_WORKSPACE/out" && shasum -a 256 "DHbox-$VERSION.zip" | tee "DHbox-$VERSION.zip.sha256")

      - name: Verify the signature with the key built into the app
        working-directory: source
        run: |
          key=$(sed -n 's/.*publicKey = "\(.*\)"/\1/p' App/Sources/Support/UpdateKey.swift)
          swift scripts/release/verify_update.swift "$key" "$GITHUB_WORKSPACE/out/DHbox-$VERSION.zip" "$GITHUB_WORKSPACE/out/DHbox-$VERSION.zip.sig"

      - name: Make the disk image
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-venv"
          "$RUNNER_TEMP/dmg-venv/bin/pip" install --quiet dmgbuild
          app="$GITHUB_WORKSPACE/source/build/DerivedData/Build/Products/Release/DHbox.app"
          DHBOX_APP="$app" "$RUNNER_TEMP/dmg-venv/bin/dmgbuild" -s tools/scripts/dmg_settings.py "DHbox $VERSION" "out/DHbox-$VERSION.dmg"
          # The app inside the image must still be validly signed and be this version.
          mkdir -p "$RUNNER_TEMP/dmg-mount"
          hdiutil attach "out/DHbox-$VERSION.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg-mount" >/dev/null
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg-mount/DHbox.app"
          test -L "$RUNNER_TEMP/dmg-mount/Applications"
          inside=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$RUNNER_TEMP/dmg-mount/DHbox.app/Contents/Info.plist")
          hdiutil detach "$RUNNER_TEMP/dmg-mount" -quiet
          [ "$inside" = "$VERSION" ] || { echo "DMG holds $inside, expected $VERSION"; exit 1; }
          (cd out && shasum -a 256 "DHbox-$VERSION.dmg" | tee "DHbox-$VERSION.dmg.sha256")

      - name: Remove the signing certificate
        if: always() && steps.cert.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true

      - name: Publish
        working-directory: out
        run: |
          gh release upload "$TAG" "DHbox-$VERSION.dmg" "DHbox-$VERSION.dmg.sha256" "DHbox-$VERSION.zip" "DHbox-$VERSION.zip.sig" "DHbox-$VERSION.zip.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
